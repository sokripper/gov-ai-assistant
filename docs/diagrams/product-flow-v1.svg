<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">政府侧 AI 助手一期产品流程</title>
  <desc id="desc">用户从统一工作台选择六个一期场景，公众号排版以已审定正文和实拍图为输入，活动与宣传策划先选择创意玩法再形成正式方案，所有任务由统一任务平台和 Codex Worker 池处理，最终经人工确认后输出。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16375B" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#67809A"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1D63B7"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20364A}
      .title{font-size:30px;font-weight:750;fill:#153A61}
      .sub{font-size:15px;fill:#62778B}
      .stage{font-size:14px;font-weight:700;letter-spacing:1px;fill:#1D63B7}
      .h{font-size:17px;font-weight:700}
      .b{font-size:13px;fill:#607386}
      .w{fill:#fff}
      .step{font-size:14px;font-weight:700;fill:#fff}
      .arrow{stroke:#67809A;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .blue-arrow{stroke:#1D63B7;stroke-width:2.5;fill:none;marker-end:url(#arrowBlue)}
      .dash{stroke:#7A90A5;stroke-width:1.8;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#F5F8FC"/>
  <circle cx="1480" cy="55" r="120" fill="#E7F0FB"/>
  <circle cx="80" cy="930" r="150" fill="#E9F5EE"/>

  <text x="64" y="52" class="title">政府侧 AI 助手 · 一期产品流程</text>
  <text x="64" y="81" class="sub">一张图讲清：用户选什么 → 重点场景怎么走 → 平台怎么执行 → 结果如何交付</text>

  <!-- Stage 1 -->
  <text x="64" y="123" class="stage">01 统一入口与场景选择</text>
  <rect x="64" y="140" width="1472" height="222" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>

  <rect x="88" y="168" width="220" height="166" rx="16" fill="#153F6D"/>
  <circle cx="128" cy="204" r="21" fill="#2D6EAE"/>
  <text x="128" y="210" text-anchor="middle" class="step">1</text>
  <text x="112" y="251" class="h w">首页工作台</text>
  <text x="112" y="278" class="b" fill="#D8E7F5">快捷入口 · 最近会话</text>
  <text x="112" y="301" class="b" fill="#D8E7F5">知识库问答 · 任务恢复</text>

  <path d="M308 251 H356" class="blue-arrow"/>

  <g transform="translate(376 166)">
    <rect width="344" height="72" rx="13" fill="#E9F2FE" stroke="#B9D2F0"/>
    <circle cx="38" cy="36" r="20" fill="#1D63B7"/><text x="38" y="42" text-anchor="middle" class="step">写</text>
    <text x="72" y="31" class="h">政务材料写作</text><text x="72" y="53" class="b">通知、报告、总结、讲话稿</text>
  </g>
  <g transform="translate(736 166)">
    <rect width="344" height="72" rx="13" fill="#F0EBFB" stroke="#D5C5F0"/>
    <circle cx="38" cy="36" r="20" fill="#704DB4"/><text x="38" y="42" text-anchor="middle" class="step">宣</text>
    <text x="72" y="31" class="h">公众号图文排版</text><text x="72" y="53" class="b">审定稿、实拍图、标题、专属基调</text>
  </g>
  <g transform="translate(1096 166)">
    <rect width="344" height="72" rx="13" fill="#EAF6EF" stroke="#BFDCCA"/>
    <circle cx="38" cy="36" r="20" fill="#2E7D54"/><text x="38" y="42" text-anchor="middle" class="step">研</text>
    <text x="72" y="31" class="h">产业与政策研究</text><text x="72" y="53" class="b">专题分析、区域对比、建议</text>
  </g>
  <g transform="translate(376 252)">
    <rect width="344" height="72" rx="13" fill="#E9F5FA" stroke="#B7DCE9"/>
    <circle cx="38" cy="36" r="20" fill="#247F9F"/><text x="38" y="42" text-anchor="middle" class="step">数</text>
    <text x="72" y="31" class="h">运营数据分析</text><text x="72" y="53" class="b">Excel 指标、趋势、选题建议</text>
  </g>
  <g transform="translate(736 252)">
    <rect width="344" height="72" rx="13" fill="#FFF3E3" stroke="#F1D4AA"/>
    <circle cx="38" cy="36" r="20" fill="#C27618"/><text x="38" y="42" text-anchor="middle" class="step">策</text>
    <text x="72" y="31" class="h">活动与宣传策划</text><text x="72" y="53" class="b">创意玩法、正式方案、传播节奏</text>
  </g>
  <g transform="translate(1096 252)">
    <rect width="344" height="72" rx="13" fill="#FCEDEF" stroke="#ECC6CB"/>
    <circle cx="38" cy="36" r="20" fill="#B74F5D"/><text x="38" y="42" text-anchor="middle" class="step">会</text>
    <text x="72" y="31" class="h">会议纪要</text><text x="72" y="53" class="b">转写、议定事项、待办确认</text>
  </g>

  <!-- Stage 2 -->
  <text x="64" y="404" class="stage">02 重点场景：公众号图文排版闭环</text>
  <rect x="64" y="421" width="1472" height="168" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>

  <g transform="translate(96 461)">
    <rect width="340" height="86" rx="14" fill="#F5F0FF" stroke="#D8C8F2"/>
    <circle cx="28" cy="27" r="16" fill="#704DB4"/><text x="28" y="32" text-anchor="middle" class="step">1</text>
    <text x="55" y="31" class="h">导入已审定素材</text><text x="20" y="61" class="b">三审三校正文 · 已确认实拍图片</text>
  </g>
  <path d="M436 504 H480" class="arrow"/>
  <g transform="translate(480 451)">
    <rect width="520" height="106" rx="14" fill="#704DB4" stroke="#5E3EA0"/>
    <circle cx="28" cy="27" r="16" fill="#9271CB"/><text x="28" y="32" text-anchor="middle" class="step">2</text>
    <text x="55" y="33" class="h w">生成标题与文章专属基调</text>
    <text x="28" y="66" class="b" fill="#EDE5FB">标题候选 + 原文依据 + 视觉简报 + 设计方向候选</text>
    <text x="28" y="88" class="b" fill="#EDE5FB">非固定模板：可微调当前方向，或全部不满意后整批换方向</text>
  </g>
  <path d="M1000 504 H1044" class="arrow"/>
  <g transform="translate(1044 461)">
    <rect width="460" height="86" rx="14" fill="#EAF6EF" stroke="#BFDCCA"/>
    <circle cx="28" cy="27" r="16" fill="#2E7D54"/><text x="28" y="32" text-anchor="middle" class="step">3</text>
    <text x="55" y="31" class="h">选择成稿形态并确认</text><text x="20" y="61" class="b">常规图文：两类首图 · 故事长图：审分镜后逐镜生成</text>
  </g>

  <!-- Stage 3 -->
  <text x="64" y="631" class="stage">03 全部场景共用的平台执行链</text>
  <rect x="64" y="648" width="1472" height="162" rx="20" fill="#EAF2FC" stroke="#C7DAEF"/>
  <g transform="translate(92 688)">
    <rect width="200" height="78" rx="13" fill="#FFFFFF"/><text x="100" y="32" text-anchor="middle" class="h">接收任务</text><text x="100" y="55" text-anchor="middle" class="b">身份 · 参数 · 文件</text>
  </g>
  <path d="M292 727 H336" class="blue-arrow"/>
  <g transform="translate(336 688)">
    <rect width="200" height="78" rx="13" fill="#FFFFFF"/><text x="100" y="32" text-anchor="middle" class="h">任务排队</text><text x="100" y="55" text-anchor="middle" class="b">并发 · 超时 · 重试</text>
  </g>
  <path d="M536 727 H580" class="blue-arrow"/>
  <g transform="translate(580 688)">
    <rect width="220" height="78" rx="13" fill="#1D63B7"/><text x="110" y="32" text-anchor="middle" class="h w">Codex Worker 池</text><text x="110" y="55" text-anchor="middle" class="b" fill="#DCEBFA">理解 · 编排 · 工具调用</text>
  </g>
  <path d="M800 727 H844" class="blue-arrow"/>
  <g transform="translate(844 688)">
    <rect width="240" height="78" rx="13" fill="#FFFFFF"/><text x="120" y="32" text-anchor="middle" class="h">模型与专用能力</text><text x="120" y="55" text-anchor="middle" class="b">VikingDB · OCR · ASR · 图片</text>
  </g>
  <path d="M1084 727 H1128" class="blue-arrow"/>
  <g transform="translate(1128 688)">
    <rect width="200" height="78" rx="13" fill="#FFFFFF"/><text x="100" y="32" text-anchor="middle" class="h">整理结果</text><text x="100" y="55" text-anchor="middle" class="b">结构化 · 版本 · 回写</text>
  </g>
  <path d="M1328 727 H1372" class="blue-arrow"/>
  <g transform="translate(1372 688)">
    <rect width="136" height="78" rx="13" fill="#2E7D54"/><text x="68" y="32" text-anchor="middle" class="h w">返回页面</text><text x="68" y="55" text-anchor="middle" class="b" fill="#E0F2E7">可继续编辑</text>
  </g>

  <!-- Stage 4 -->
  <text x="64" y="852" class="stage">04 资料支撑、结果出口与本期边界</text>
  <rect x="64" y="869" width="460" height="94" rx="16" fill="#EAF6EF" stroke="#BFDCCA"/>
  <text x="92" y="902" class="h">知识库持续供给</text>
  <text x="92" y="929" class="b">公共知识源 + 单位知识源 → 合并检索 → 引用溯源</text>
  <text x="92" y="950" class="b">文档上传、解析、启停与切片治理由平台负责</text>

  <rect x="550" y="869" width="460" height="94" rx="16" fill="#FFF3E3" stroke="#F1D4AA"/>
  <text x="578" y="902" class="h">人工确认后交付</text>
  <text x="578" y="929" class="b">文稿 / 图文 / 报告 / 图表 / 纪要 / 待办</text>
  <text x="578" y="950" class="b">AI 提供辅助结果，不替代审批、审核与正式发布</text>

  <rect x="1036" y="869" width="500" height="94" rx="16" fill="#FCEDEF" stroke="#ECC6CB"/>
  <text x="1064" y="902" class="h">明确后置</text>
  <text x="1064" y="929" class="b">外部公众号持续监控 · 全网实时监控 · Seedance 视频</text>
  <text x="1064" y="950" class="b">政策一致性 / 保密审核 · 民生诉求自动答复</text>

  <path d="M294 869 C294 838 690 842 690 810" class="dash"/>
  <path d="M1250 810 C1250 842 780 838 780 869" class="dash"/>
</svg>
